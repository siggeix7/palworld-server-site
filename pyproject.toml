[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
  "web/dashboard/migrations",
  "web/live-map/node_modules",
  "web/live-map/dist",
  "staticfiles",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"web/dashboard/models.py" = ["RUF012"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
